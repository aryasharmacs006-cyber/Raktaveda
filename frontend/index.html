<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raktaveda | Blood when it matters</title>
<meta name="description" content="Find blood donors, blood banks and hospitals near you. Post an emergency request and connect in minutes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2C16 2 6 13 6 20a10 10 0 0 0 20 0C26 13 16 2 16 2z' fill='%23C3112B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F2F5F9;--surface:#fff;--surface2:#F7F9FC;--ink:#0F1B2D;--muted:#5A6779;--line:#E1E7EF;
  --brand:#C3112B;--brand2:#8E0B1F;--on-brand:#fff;--tint:#FDE9EC;--teal:#0E8C84;--tealtint:#DCF3F0;
  --amber:#B45309;--ambertint:#FEF0D9;--shadow:0 1px 2px rgba(15,27,45,.06),0 12px 32px -12px rgba(15,27,45,.18);
  --r:18px;--font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:'Fraunces',Georgia,serif;
}
:root[data-theme=dark]{
  --bg:#12151A;--surface:#1B2027;--surface2:#222831;--ink:#EEF1F5;--muted:#9BA7B6;--line:#2D3440;
  --brand:#FF7683;--brand2:#FF9AA3;--on-brand:#2A0A0F;--tint:#35262B;--teal:#55D3C6;--tealtint:#1E3636;
  --amber:#F5B861;--ambertint:#37301F;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,5.2vw,4.1rem)}h2{font-size:clamp(1.7rem,3vw,2.4rem)}h3{font-size:1.25rem}
p{margin:0 0 1em}a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hide{display:none!important}
/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 1.35rem var(--display)}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
nav.main a:hover{background:var(--surface)}nav.main a.on{background:var(--tint);color:var(--brand)}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
select.lang{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;cursor:pointer}
.burger{display:none}
@media(max-width:860px){nav.main{position:fixed;inset:68px 0 auto 0;background:var(--surface);flex-direction:column;padding:12px 20px 20px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:transform .25s;z-index:40}
nav.main.open{transform:none}.burger{display:grid}header.top .wrap{gap:10px}.brand{flex:1}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;font-size:.96rem}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 8px 20px -8px var(--brand)}
.btn.primary:hover{box-shadow:0 12px 26px -8px var(--brand);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--brand)}
.btn.teal{background:var(--teal);color:#fff}.btn.danger{background:transparent;border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:7px 14px;font-size:.85rem}.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--tint);color:var(--brand)}
.pill.ok{background:var(--tealtint);color:var(--teal)}.pill.warn{background:var(--ambertint);color:var(--amber)}.pill.mute{background:var(--surface2);color:var(--muted)}
section.block{padding:72px 0}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#7E0A1D 0%,#B50F29 55%,#D8283F 100%);color:#fff}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#2A1519 0%,#4A1E27 55%,#6A2A35 100%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero h1{color:#fff}.hero p.lead{font-size:1.15rem;opacity:.92;max-width:34em}
.hero .btn.primary{background:#fff;color:#8E0B1F;box-shadow:0 12px 28px -10px rgba(0,0,0,.5)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero-art{position:relative;aspect-ratio:1;max-width:460px;justify-self:center;width:100%}
.hero-art svg{width:100%;height:100%;display:block}
.chip-float{position:absolute;background:#fff;color:#8E0B1F;font:700 1rem var(--font);padding:8px 14px;border-radius:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.ecg{stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 3.2s linear infinite}
@keyframes ecg{60%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
.ripple{transform-origin:50% 56%;animation:rip 4s ease-out infinite}
@keyframes rip{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.25);opacity:0}}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:320px;order:-1}}
/* quick search */
.qs{margin-top:-34px;position:relative;z-index:5}
.qs .card{display:grid;grid-template-columns:1.1fr 1fr auto;gap:16px;align-items:end}
@media(max-width:860px){.qs .card{grid-template-columns:1fr}}
label.f{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select.in,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
/* steps */
.steps{counter-reset:s}.step{position:relative;padding-left:64px;min-height:56px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font:700 1.3rem var(--display)}
/* quotes */
.quotes{position:relative;border-radius:28px;overflow:hidden;min-height:300px;color:#fff;box-shadow:var(--shadow)}
.q-slide{position:absolute;inset:0;padding:48px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:scale(1.02);transition:opacity .9s,transform 1.4s;pointer-events:none}
.q-slide.on{opacity:1;transform:none;pointer-events:auto}
.q-slide blockquote{margin:0;font:700 clamp(1.5rem,3.2vw,2.5rem)/1.2 var(--display);max-width:22em}
.q-slide .by{margin-top:18px;opacity:.85;font-weight:600}
.q-slide::after{content:"\201C";position:absolute;right:28px;top:-30px;font:700 15rem/1 var(--display);opacity:.12}
.q0{background:linear-gradient(120deg,#8E0B1F,#D8283F)}.q1{background:linear-gradient(120deg,#0B6E6A,#17A398)}.q2{background:linear-gradient(120deg,#16315C,#2E64B5)}.q3{background:linear-gradient(120deg,#9A3412,#E0761F)}.q4{background:linear-gradient(120deg,#14532D,#2E9E5B)}
.q-dots{position:absolute;left:48px;bottom:22px;display:flex;gap:8px;z-index:3}
.q-dots button{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0;transition:width .3s,background .3s}
.q-dots button.on{width:34px;background:#fff}
@media(max-width:600px){.q-slide{padding:28px}.q-dots{left:28px}}
/* compat */
.bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bg-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 0;font:700 1.15rem var(--display);cursor:pointer;color:var(--ink);transition:all .15s}
.bg-btn:hover{border-color:var(--brand)}.bg-btn.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.bg-badge{display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--on-brand);font:700 1.1rem var(--display);padding:0 8px}
/* role cards */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.role{position:relative;overflow:hidden;border-radius:24px;padding:28px;min-height:240px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .25s,box-shadow .25s;box-shadow:var(--shadow);cursor:pointer;border:0;text-align:left}
.role:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 24px 44px -18px rgba(0,0,0,.5)}
.role svg.bgart{position:absolute;right:-24px;top:-14px;width:62%;opacity:.14}
.role h3{color:#fff;font-size:1.55rem;margin-bottom:6px}.role p{margin:0 0 12px;opacity:.92;font-size:.95rem}
.role .go{font-weight:700;display:inline-flex;gap:6px;align-items:center}
.r-user{background:linear-gradient(150deg,#B50F29,#E0485B)}.r-inst{background:linear-gradient(150deg,#0B5E63,#17A398)}.r-admin{background:linear-gradient(150deg,#1B2A47,#3A5B94)}
:root[data-theme=dark] .r-user{background:linear-gradient(150deg,#6A2A35,#A04555)}:root[data-theme=dark] .r-inst{background:linear-gradient(150deg,#1D4A4C,#2A8077)}:root[data-theme=dark] .r-admin{background:linear-gradient(150deg,#26344F,#44659C)}
/* auth split */
.auth{display:grid;grid-template-columns:.9fr 1.1fr;min-height:calc(100vh - 68px)}
.auth-side{position:relative;overflow:hidden;color:#fff;padding:56px 44px;display:flex;flex-direction:column;justify-content:center}
.auth-side h2{color:#fff}.auth-side ul{list-style:none;padding:0;margin:20px 0 0}.auth-side li{display:flex;gap:12px;margin-bottom:14px;opacity:.95}
.auth-side li b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:.8rem}
.auth-main{display:grid;place-items:center;padding:40px 20px}.auth-box{width:100%;max-width:440px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-side{padding:32px 24px}}
.field{position:relative;margin-bottom:16px}
.field input{padding:22px 14px 8px}.field label{position:absolute;left:15px;top:15px;color:var(--muted);transition:all .15s;pointer-events:none;font-size:1rem}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:6px;font-size:.72rem;font-weight:700;color:var(--brand)}
.field .eye{position:absolute;right:8px;top:8px;border:0;background:none;cursor:pointer;padding:6px 10px;color:var(--muted);font-weight:600}
.otp{display:flex;gap:10px;justify-content:center;margin:18px 0}
.otp input{width:48px;height:58px;text-align:center;font:700 1.5rem var(--display);padding:0}
.err{background:var(--tint);color:var(--brand);padding:10px 14px;border-radius:12px;font-weight:600;font-size:.9rem;margin-bottom:14px}
.note{background:var(--tealtint);color:var(--teal);padding:10px 14px;border-radius:12px;font-weight:600;font-size:.9rem;margin-bottom:14px}
/* map */
.mapbox{isolation:isolate;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.map{height:520px;background:var(--surface2);z-index:1}.map.sm{height:280px}
.leaflet-container{font-family:var(--font)}
.pin{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;background:var(--brand);box-shadow:0 6px 14px rgba(0,0,0,.35);border:2px solid #fff}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:.8rem}.pin.bank{background:var(--teal)}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 8px rgba(37,99,235,.25)}
.map-lock{position:absolute;inset:0;z-index:600;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.res{display:flex;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s}
.res:hover,.res.on{border-color:var(--brand)}
.res .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--brand);font-weight:800}.res .ic.bank{background:var(--tealtint);color:var(--teal)}
.list{display:grid;gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.find-grid{display:grid;grid-template-columns:360px 1fr;gap:18px}
@media(max-width:900px){.find-grid{grid-template-columns:1fr}.map{height:380px}.list{max-height:none}}
/* board */
.ticket{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 16px 24px;overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--line)}
.ticket.CRITICAL::before{background:#E11D48}.ticket.HIGH::before{background:#EA580C}.ticket.MEDIUM::before{background:#CA8A04}.ticket.LOW::before{background:var(--teal)}
@media(max-width:640px){.ticket{grid-template-columns:auto 1fr}.ticket .acts{grid-column:1/-1}}
.lane{border:2px dashed var(--line);border-radius:20px;padding:22px;background:var(--surface)}
/* dashboard */
.dash{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:28px 0 60px}
.side{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600}
.side a:hover{background:var(--surface)}.side a.on{background:var(--brand);color:var(--on-brand)}
@media(max-width:860px){.dash{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow:auto}.side a{white-space:nowrap}}
.stat{display:flex;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:.8rem}
.tbl{overflow:auto}
.toggle{position:relative;width:58px;height:32px;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--teal)}.toggle.on::after{transform:translateX(26px)}
/* chat */
.chat{display:grid;grid-template-columns:280px 1fr;gap:16px;height:560px}
@media(max-width:860px){.chat{grid-template-columns:1fr;height:auto}}
.convs{overflow:auto;display:grid;gap:8px;align-content:start}
.conv{padding:12px 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}.conv.on{border-color:var(--brand);background:var(--tint)}
.thread{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;min-height:420px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 14px;border-radius:16px;background:var(--surface2);align-self:flex-start;word-break:break-word}.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand)}
.msg small{display:block;opacity:.7;font-size:.7rem;margin-top:2px}.msg .rp{background:none;border:0;cursor:pointer;opacity:.55;font-size:.7rem;color:inherit;padding:0 0 0 8px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
/* modal toast */
.overlay{position:fixed;inset:0;background:rgba(8,12,20,.55);display:grid;place-items:center;z-index:200;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:22px;padding:28px;max-width:480px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:300}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);animation:fade .2s}
.toast.bad{background:#B91C1C;color:#fff}
/* assistant */
.fab{position:fixed;right:20px;bottom:20px;z-index:90;height:56px;padding:0 22px 0 16px;border-radius:99px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 14px 30px -10px var(--brand)}
.ast{position:fixed;right:20px;bottom:92px;z-index:91;width:min(380px,calc(100vw - 40px));height:480px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.ast header{padding:14px 18px;background:var(--brand);color:var(--on-brand);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.ast .msgs{background:var(--bg)}
/* prose + footer */
.prose{max-width:760px}.prose h2{margin-top:1.6em;font-size:1.5rem}.prose li{margin-bottom:.4em}
footer.foot{background:var(--surface);border-top:1px solid var(--line);padding:40px 0 30px;margin-top:40px}
.skel{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:70px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.view{animation:fade .3s;min-height:62vh}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
'use strict';
/* ============ CONFIG ============ */
const API_BASE = (window.RAKTAVEDA_API || (()=>{try{return localStorage.getItem('rv_api')}catch(e){return null}})() || 'http://localhost:8080').replace(/\/$/,'');
const CONTACT_EMAIL = ''; // optional: shown on the Privacy and Terms pages when set
const NOTTO_URL = 'https://notto.mohfw.gov.in/';
const GROUPS = ['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const COMPONENTS = ['WHOLE_BLOOD','PACKED_RED_CELLS','PLATELETS','PLASMA'];
const URGENCIES = ['LOW','MEDIUM','HIGH','CRITICAL'];
const COMPAT = { // standard ABO/Rh red-cell compatibility: recipient -> donors
 'A+':['A+','A-','O+','O-'],'A-':['A-','O-'],'B+':['B+','B-','O+','O-'],'B-':['B-','O-'],

class ApiError extends Error{constructor(status,body){super((body&&body.message)||'ERROR');this.status=status;this.code=body&&body.error;this.key=body&&body.message;this.body=body}}
const ERR={VALIDATION_FAILED:'Please check the details you entered.',OTP_INVALID:'That code is not correct.',OTP_EXPIRED:'That code has expired. Ask for a new one.',OTP_LOCKED:'Too many wrong attempts. Ask for a new code.',

const errText = e=>{if(!(e instanceof ApiError))return 'Cannot reach the server. Check that the backend is running.';return ERR[e.code]||ERR[e.key]||(e.status===429?ERR.RATE_LIMITED:'Something went wrong. Please try again.')};
async function api(path,o={}){
  const h={};if(S.token&&o.auth!==false)h.Authorization='Bearer '+S.token;
  let body;if(o.form){body=o.form}else if(o.body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.body)}
  let r;try{r=await fetch(API_BASE+path,{method:o.method||(body?'POST':'GET'),headers:h,body})}catch(e){throw new ApiError(0,null)}
  if(r.status===204)return null;
  let data=null;try{data=await r.json()}catch(e){}
  if(r.ok||(o.okStatuses&&o.okStatuses.includes(r.status)))return data;
  if(r.status===401&&S.token&&o.auth!==false){setSession(null);toast('Please log in again.',true);go('#/login')}
  throw new ApiError(r.status,data);
}
function setSession(tok,role,inst){S.token=tok||null;S.role=role||null;S.inst=inst||null;store.set('rv_token',S.token);store.set('rv_role',S.role);store.set('rv_inst',S.inst)}

const TILES={light:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',dark:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

function makeMap(el,center,zoom){
  if(!window.L){el.innerHTML='<div class="empty">The map could not load. Check your internet connection and refresh.</div>';return null}
  const m=L.map(el,{zoomControl:true,scrollWheelZoom:true}).setView(center||CENTER,zoom||5);
  let errs=0;let layer=L.tileLayer(S.theme==='dark'?TILES.dark:TILES.light,{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(m);
  layer.on('tileerror',()=>{if(++errs===4){m.removeLayer(layer);L.tileLayer(TILES.esri,{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(m)}});
  setTimeout(()=>m.invalidateSize(),150);onLeave(()=>{try{m.remove()}catch(e){}});return m;
}
const pinIcon=(label,bank)=>L.divIcon({className:'',html:`<div class="pin ${bank?'bank':''}"><span>${label}</span></div>`,iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-34]});
const meIcon=()=>L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const getPos=()=>new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('nogeo'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),rej,{enableHighAccuracy:false,timeout:12000,maximumAge:60000})});
/* location picker: click map or use GPS; writes to hidden inputs lat/lon in the form */
function mountPicker(host,form,start){
  mount(host,html`<div class="mapbox"><div class="map sm" id="pickmap"></div></div><div class="row" style="margin-top:8px"><button type="button" class="btn ghost sm" id="useGps">Use my current location</button><span class="small muted" id="pickTxt">Tap the map to set the location.</span></div>`);
  const m=makeMap($('#pickmap',host),start?[start.lat,start.lon]:CENTER,start?14:5);let mk=null;
  const set=(lat,lon,fly)=>{form.elements.latitude.value=lat.toFixed(5);form.elements.longitude.value=lon.toFixed(5);$('#pickTxt',host).textContent='Location set.';if(!m)return;if(mk)mk.setLatLng([lat,lon]);else mk=L.marker([lat,lon],{icon:pinIcon('•')}).addTo(m);if(fly)m.setView([lat,lon],15)};
  if(m)m.on('click',e=>set(e.latlng.lat,e.latlng.lng));
  if(start)set(start.lat,start.lon);
  $('#useGps',host).onclick=async()=>{try{const p=await getPos();set(p.lat,p.lon,true)}catch(e){toast('Could not get your location. Tap the map instead.',true)}};
}

PAGES.find=async(v,_,q)=>{

      <div class="mapbox"><div class="map" id="fmap"></div>
      ${canSearch?'':S.token?html`<div class="map-lock"><div class="card center" style="max-width:360px"><h3>Search is for donors and institutions</h3><p class="muted">Administrator accounts cannot search nearby.</p></div></div>`
        :html`<div class="map-lock"><div class="card center" style="max-width:380px"><h3>Log in to see who is nearby</h3><p class="muted">We ask you to log in so that phone numbers and locations are only shown to real people.</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/login/user">Log in with phone</a><a class="btn ghost" href="#/login/institution">Institution</a></div></div></div>`}
      </div></div></div>`);
  const map=makeMap($('#fmap'),CENTER,5);
  st.layer=window.L&&map?L.layerGroup().addTo(map):null;
  acts.ftype=el=>{st.type=el.dataset.v;$$('#ftype button').forEach(b=>b.classList.toggle('on',b===el))};
  $('#fr').oninput=e=>{st.r=+e.target.value;$('#frv').textContent=st.r+' km'};
  const draw=(rows)=>{

    const pts=[];
    mount(list,html`${rows.map((r,i)=>html`<div class="res" data-act="focus" data-i="${i}" tabindex="0"><div class="ic ${r.type==='BLOOD_BANK'?'bank':''}">${r.type==='BLOOD_BANK'?'BB':'H'}</div>

const legalWrap=(title,body)=>html`<div class="wrap" style="padding:40px 20px 20px"><div class="prose"><h1 style="font-size:clamp(2rem,4vw,3rem)">${title}</h1><p class="muted">Last updated 26 November 2026</p>${body}${CONTACT_EMAIL?html`<h2>Contact</h2><p>Questions about this page: <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></p>`:''}</div></div>`;
PAGES.privacy=async v=>mount(v,legalWrap('Privacy policy',raw(`
<p>Raktaveda connects people who need blood with donors, hospitals and blood banks. This page explains what we collect, why, and the choices you have. We collect only what is needed to make a match, and nothing more.</p>
<h2>What we collect</h2><ul>
<li><b>Donors and families:</b> your phone number, and if you become a donor, your blood group, date of birth, weight and last donation date.</li>
<li><b>Institutions:</b> name, type, licence number, email, two phone numbers, address and map position.</li>
<li><b>Location:</b> only the position you choose to share. A donor’s location is stored only while “Available now” is on and is removed when you switch it off. We do not keep a history of where you have been.</li>
<li><b>Requests and chat:</b> the details of a blood request, the replies to it, and messages exchanged between a user and a verified institution.</li></ul>
<h2>How we protect it</h2><ul>
<li>Phone numbers and dates of birth are encrypted when stored.</li>
<li>One-time codes and login tokens are stored only as irreversible hashes. Institution passwords are hashed.</li>
<li>Codes expire quickly and lock after repeated wrong attempts.</li>
<li>Logs do not contain phone numbers, codes, tokens or exact locations.</li>
<li>Sensitive actions such as verification, requests, reports and admin decisions are written to an audit log.</li></ul>
<h2>Who sees what</h2><ul>
<li>A requester sees a donor only as a number and a masked contact until the donor accepts. After acceptance, the donor’s phone number is shown to that requester.</li>
<li>Donors see the distance and details of a request, never the requester’s exact location.</li>
<li>Only the two people in a conversation can read it. If a message is reported, the administrators can read that message to decide what to do.</li>
<li>Institutions appear on the map only after an administrator has verified them.</li></ul>
<h2>The Rakta assistant</h2><p>Questions you type to the assistant are checked to remove phone numbers, emails and dates of birth before they are processed. We do not store your question or the answer. We count how many questions you ask each day so the service stays fair for everyone.</p>
<h2>We never sell your data</h2><p>We do not sell personal data, and we do not sell blood or organs. We do not show advertising.</p>
<h2>Your choices</h2><ul><li>Switch off “Available now” at any time to remove your shared location.</li><li>Delete your account from your dashboard. You confirm twice (a password or code, and typing DELETE). Your personal data is then removed.</li><li>Log out to end your session. Sessions also expire on their own.</li></ul>
<h2>Retention</h2><p>Personal data is kept only as long as your account is active. Audit entries record what happened but are kept free of contact details.</p>
<h2>Children</h2><p>Raktaveda is for adults. Donors must meet the age requirement shown in their eligibility check.</p>
<h2>Changes</h2><p>If we change this policy, the date at the top will change. Continuing to use Raktaveda means you accept the updated policy.</p>`)));
PAGES.terms=async v=>mount(v,legalWrap('Terms of use',raw(`
<p>By creating an account or using Raktaveda, you agree to these terms.</p>
<h2>What Raktaveda is</h2><p>Raktaveda is a connection platform. It helps people who need blood find donors, hospitals and blood banks. We do not collect, store, test or supply blood, and we never sell blood or organs.</p>
<h2>No promises about donors or supply</h2><p>We cannot promise that a donor will respond or attend, or that blood will be available. In a medical emergency, call your local emergency number or go directly to the nearest hospital.</p>
<h2>Eligibility is an estimate</h2><p>The eligibility result in your dashboard is a guide based on age, weight and time since your last donation. The blood bank or hospital makes the final decision after its own checks, including haemoglobin. Always follow the advice of medical professionals.</p>
<h2>Your account</h2><ul><li>Give accurate information and keep your login details private.</li><li>Donors: set “Available now” only when you can really donate.</li><li>Institutions: you must hold a valid licence. Your account can act only after an administrator verifies it, and may be suspended if information is wrong.</li></ul>
<h2>Using the service fairly</h2><ul><li>Post a request only for a real need.</li><li>Do not harass, spam, mislead, or ask for payment for blood. Do not share another person’s contact details.</li><li>Do not try to break, overload or bypass the security of the service.</li></ul>
<h2>Chat and reports</h2><p>Chat is for coordinating blood needs. You can report any message. Administrators may review reported messages and may limit or suspend accounts that break these terms.</p>
<h2>Rakta assistant</h2><p>The assistant gives general information about donating and using Raktaveda. It is not a doctor and cannot give medical advice, doses or diagnoses.</p>
<h2>Organ donation</h2><p>Raktaveda only points you to the official national portal. Pledges are made there, not here.</p>
<h2>Availability and liability</h2><p>We work to keep Raktaveda running but cannot guarantee it will always be available or error free. To the extent allowed by law, Raktaveda is not liable for outcomes that depend on third parties such as donors, hospitals and blood banks.</p>
<h2>Ending your account</h2><p>You can delete your account at any time from your dashboard. We may suspend accounts that break these terms.</p>
<h2>Changes</h2><p>We may update these terms. The date at the top shows the latest version. Continuing to use Raktaveda means you accept the changes.</p>`)));

const AUTH={cid:null,kind:null,len:6};
const sideBullets=b=>html`<ul>${b.map(x=>html`<li><b>✓</b><span>${x}</span></li>`)}</ul>`;
const otpHtml=n=>html`<div class="otp" id="otp">${Array.from({length:n},(_,i)=>html`<input inputmode="numeric" maxlength="1" autocomplete="${i?'off':'one-time-code'}" data-i="${i}" aria-label="Digit ${i+1}">`)}</div>`;
function wireOtp(){const ins=$$('#otp input');ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus()});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()});
  el.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'');if(!d)return;e.preventDefault();ins.forEach((x,k)=>x.value=d[k]||'');(ins[Math.min(d.length,ins.length-1)]).focus()})});ins[0]&&ins[0].focus()}
const readOtp=()=>$$('#otp input').map(i=>i.value).join('');
const sideFor=k=>({
 user:{cls:'r-user',h:'Welcome back, lifesaver.',b:['Your phone number is never shown until you accept a request','Switch availability on or off whenever you like','Delete your data any time']},
 institution:{cls:'r-inst',h:'For hospitals and blood banks.',b:['Verified institutions appear on the map','Post requests and reach nearby donors','Two-step sign in protects your account']},
 admin:{cls:'r-admin',h:'Keep Raktaveda safe.',b:['Verify and review institutions','Moderate reported messages','Every action is recorded in the audit log']}}[k]);

   ?html`<h2>Log in with your phone</h2><p class="muted">We will send a one-time code to your phone.</p><div id="aerr"></div>

   :html`<h2>${kind==='admin'?'Administrator sign in':'Institution sign in'}</h2><p class="muted">Enter your email and password. We will then send a code to your email.</p><div id="aerr"></div>

     <button class="btn primary" style="width:100%">${t('continue')}</button></form>${kind==='institution'?html`<p class="muted small center" style="margin-top:18px">New here? <a href="#/register/institution">Register your institution</a></p>`:''}`;
  mount(v,html`<div class="auth"><aside class="auth-side ${sd.cls}" style="${kind==='user'?'background:linear-gradient(150deg,#8E0B1F,#D8283F)':kind==='institution'?'background:linear-gradient(150deg,#0B5E63,#17A398)':'background:linear-gradient(150deg,#1B2A47,#3A5B94)'}">
    <svg viewBox="0 0 100 100" style="position:absolute;right:-60px;bottom:-60px;width:340px;opacity:.14"><path d="M50 4C50 4 18 40 18 64a32 32 0 0 0 64 0C82 40 50 4 50 4z" fill="#fff"/></svg>
    <div style="position:relative"><div class="brand" style="color:#fff;margin-bottom:26px">${dropSvg(34)}Raktaveda</div><h2>${sd.h}</h2>${sideBullets(sd.b)}
    <p style="margin-top:28px"><a href="#/login" style="color:#fff">‹ Choose a different role</a></p></div></aside>
    <div class="auth-main"><div class="auth-box" id="abox">${stepOne}</div></div></div>`);
};
const stepTwo=(sub,devCode,len)=>{AUTH.len=devCode?devCode.length:(len||6);
  mount($('#abox'),html`<h2>Enter the code</h2><p class="muted">${sub}</p><div id="aerr"></div>
  ${devCode?html`<div class="note">Code for this session: <b>${devCode}</b> <button class="btn ghost sm" type="button" data-act="fillOtp" data-c="${devCode}">Fill it in</button></div>`:''}
  <form data-form="otpVerify">${otpHtml(AUTH.len)}<button class="btn primary" style="width:100%">${t('verify')}</button></form>
  <p class="center small muted" style="margin-top:14px"><a href="#/login/${AUTH.kind}" data-act="again">Start again</a></p>`);wireOtp()};
const showErr=e=>{const b=$('#aerr');if(b)mount(b,html`<div class="err" role="alert">${errText(e)}</div>`)};
acts.eye=el=>{const i=$('#pw');i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'Show':'Hide'};
acts.fillOtp=el=>{[...el.dataset.c].forEach((c,i)=>{const x=$$('#otp input')[i];if(x)x.value=c})};
acts.again=()=>{AUTH.cid=null;render()};
forms.otpReq=f=>busy($('button',f),async()=>{try{const r=await api('/api/auth/user/otp/request',{auth:false,body:{phone:f.elements.phone.value.replace(/[\s-]/g,'')}});AUTH.cid=r.challengeId;stepTwo('We sent a code to your phone. It works for a few minutes.',r.devCode)}catch(e){showErr(e)}});
forms.pwLogin=f=>busy($('button.primary',f),async()=>{try{const r=await api(`/api/auth/${AUTH.kind}/login`,{auth:false,body:{email:f.elements.email.value.trim(),password:f.elements.password.value}});AUTH.cid=r.challengeId;stepTwo('We emailed you a code. Enter it to finish signing in.',r.devCode)}catch(e){showErr(e)}});
forms.otpVerify=f=>busy($('button',f),async()=>{
  const code=readOtp();if(code.length<4){showErr(new ApiError(400,{error:'OTP_INVALID'}));return}
  try{const path=AUTH.kind==='user'?'/api/auth/user/otp/verify':'/api/auth/second-step/verify';
    const r=await api(path,{auth:false,body:{challengeId:AUTH.cid,code}});setSession(r.token,r.role);
    try{const me=await api('/api/auth/me');setSession(r.token,r.role,me.institutionStatus||null)}catch(e){}
    toast('Welcome to Raktaveda.');go('#/dashboard')}catch(e){showErr(e)}});

    else{await api('/api/donor/availability',{method:'PUT',body:{available:false}});toast('You are hidden. Your location was removed.')}
    render()}catch(e){toast(errText(e),true)}});

forms.newreq=f=>busy($('button.primary',f),async()=>{const e=f.elements;
  if(!e.latitude.value){toast('Set the location on the map first.',true);return}
  try{const r=await api('/api/requests',{body:{bloodGroup:e.bloodGroup.value,component:e.component.value,units:+e.units.value,urgency:e.urgency.value,latitude:+e.latitude.value,longitude:+e.longitude.value}});
    toast('Request sent to nearby donors.');go('#/dashboard/requests/'+(r&&r.id||''))}catch(er){toast(errText(er),true)}});
async function requestDetail(c,id){
  const draw=async()=>{
    let r;try{r=await api('/api/requests/'+id)}catch(e){mount(c,html`<div class="card empty">${errText(e)}</div>`);return}
    const open=!['CANCELLED','CLOSED','FULFILLED','EXPIRED'].includes(String(r.status).toUpperCase());const inst=S.role==='INSTITUTION';
    mount(c,html`<a href="#/dashboard/requests">‹ All requests</a>
     <div class="card" style="margin:12px 0"><div class="row between"><div class="row">${bloodBadge(r.bloodGroup)}<div><h3 style="margin:0">${nice(r.component)} · ${r.units} unit${r.units>1?'s':''}</h3><div class="small muted">${nice(r.urgency)} · posted ${ago(r.createdAt)} · ${left(r.expiresAt)}</div></div></div><span class="pill ${open?'ok':'mute'}">${nice(r.status)}</span></div>
     ${r.donorCounts?html`<div class="grid g3" style="margin-top:16px">${[['Within 5 km',r.donorCounts.within5Km],['Within 10 km',r.donorCounts.within10Km],['Within 25 km',r.donorCounts.within25Km]].map(x=>html`<div class="card flat center"><div style="font:700 2rem var(--display)">${x[1]}</div><div class="small muted">${x[0]} · compatible donors available</div></div>`)}</div>`:''}
     ${open?html`<div class="row" style="margin-top:16px">${inst?html`<label class="row small"><button class="toggle ${r.needsTransport?'on':''}" data-act="transport" data-id="${id}" data-on="${!!r.needsTransport}" aria-label="Needs transport"></button> We need transport arranged</label>`:''}<button class="btn danger sm" data-act="cancelReq" data-id="${id}">Cancel request</button></div>`:''}</div>
     <h3>Donor responses</h3>${(r.responses||[]).length?html`<div class="card tbl"><table><thead><tr><th>Donor</th><th>Blood group</th><th>Status</th><th>Contact</th><th></th></tr></thead><tbody>${r.responses.map(x=>html`<tr><td>#${x.donorNumber}</td><td>${x.bloodGroup}</td><td><span class="pill ${x.status==='ACCEPTED'?'ok':'mute'}">${nice(x.status)}</span></td>
       <td>${x.phone?html`<a href="tel:${x.phone}">${x.phone}</a>`:x.contactMasked||'Hidden until they accept'}</td>
       <td>${inst&&x.status==='ACCEPTED'&&open?html`<button class="btn teal sm" data-act="confirmDon" data-id="${id}" data-rid="${x.responseId}">Confirm donation</button>`:''}</td></tr>`)}</tbody></table></div>`:html`<div class="card empty">No responses yet. Donors nearby have been alerted.</div>`}`);
  };
  await draw();const timer=setInterval(()=>{if(location.hash.includes(id))draw()},15000);onLeave(()=>clearInterval(timer));acts.reload=draw;
}
acts.transport=el=>busy(el,async()=>{try{await api(`/api/requests/${el.dataset.id}/transport`,{method:'PUT',body:{needsTransport:el.dataset.on!=='true'}});acts.reload()}catch(e){toast(errText(e),true)}});
acts.cancelReq=async el=>{if(!await confirmBox('Cancel this request?','Donors will no longer see it.','Yes, cancel it'))return;try{await api(`/api/requests/${el.dataset.id}/cancel`,{method:'POST'});toast('Request cancelled.');acts.reload()}catch(e){toast(errText(e),true)}};
acts.confirmDon=async el=>{if(!await confirmBox('Confirm this donation?','Only confirm after the donor has actually donated. Their waiting period will start and the request will close.','Confirm donation'))return;
  try{await api(`/api/requests/${el.dataset.id}/responses/${el.dataset.rid}/confirm`,{method:'POST'});toast('Donation confirmed. Thank you.');acts.reload()}catch(e){toast(errText(e),true)}};

/* ---- chat ---- */
let ws=null,wsOn=false;const wsListeners=new Set();
function connectWs(){
  if(ws||!window.StompJs||!S.token)return;
  ws=new StompJs.Client({brokerURL:API_BASE.replace(/^http/,'ws')+'/ws',connectHeaders:{Authorization:'Bearer '+S.token},reconnectDelay:5000,heartbeatIncoming:10000,heartbeatOutgoing:10000});
  ws.onConnect=()=>{wsOn=true;ws.subscribe('/user/queue/messages',m=>{try{const d=JSON.parse(m.body);wsListeners.forEach(f=>f(d))}catch(e){}});ws.subscribe('/user/queue/errors',m=>{toast('Message not sent.',true)})};
  ws.onWebSocketClose=()=>{wsOn=false};ws.onStompError=()=>{wsOn=false};ws.activate();
}
function disconnectWs(){try{ws&&ws.deactivate()}catch(e){}ws=null;wsOn=false}
DASH['USER:chat']=DASH['INSTITUTION:chat']=async(c,id)=>{
  connectWs();
  const convs=await api('/api/chat/conversations');const me=S.role==='USER'?'USER':'INSTITUTION';
  mount(c,html`<h2>Messages</h2><div class="chat"><div class="convs">${convs.length?convs.map(x=>html`<a class="conv ${x.id===id?'on':''}" href="#/dashboard/chat/${x.id}" style="text-decoration:none;color:inherit"><b>${x.institutionName||'Conversation'}</b><div class="small muted">${x.lastMessageAt?ago(x.lastMessageAt):'No messages yet'}</div></a>`)
      :html`<div class="card empty">No conversations yet.${S.role==='USER'?html`<br>Find an institution on the map and tap <b>Message</b>.`:''}</div>`}</div>
    <div class="thread" id="thread">${id?html`<div class="msgs" id="msgs">${spinner(2)}</div><form class="composer" data-form="send"><input type="text" name="body" placeholder="Write a message" maxlength="1000" autocomplete="off" required><button class="btn primary">Send</button></form>`:html`<div class="empty" style="margin:auto">Choose a conversation.</div>`}</div></div>`);
  if(!id)return;
  const seen=new Set();const box=$('#msgs');
  const add=m=>{if(seen.has(m.id)||m.conversationId&&m.conversationId!==id)return;seen.add(m.id);const mine=m.sender===me;
    box.insertAdjacentHTML('beforeend',`<div class="msg ${mine?'me':''}">${esc(m.body)}<small>${esc(when(m.sentAt))}${mine?'':` <button class="rp" data-act="reportMsg" data-id="${m.id}">Report</button>`}</small></div>`);box.scrollTop=box.scrollHeight};
  const load=async()=>{try{const ms=await api(`/api/chat/conversations/${id}/messages`);if(!seen.size)box.innerHTML='';ms.forEach(add);if(!ms.length&&!seen.size)box.innerHTML='<div class="empty" style="margin:auto">Say hello to start the conversation.</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(errText(e))}</div>`}};
  await load();const fn=m=>{box.querySelector('.empty')&&(box.innerHTML='');add(m)};wsListeners.add(fn);
  const poll=setInterval(()=>{if(!wsOn)load()},5000);onLeave(()=>{wsListeners.delete(fn);clearInterval(poll)});
  forms.send=async f=>{const body=f.elements.body.value.trim();if(!body)return;f.elements.body.value='';
    if(wsOn){try{ws.publish({destination:'/app/chat.send',body:JSON.stringify({conversationId:id,body})});return}catch(e){}}
    try{const m=await api(`/api/chat/conversations/${id}/messages`,{body:{body}});box.querySelector('.empty')&&(box.innerHTML='');add(m)}catch(e){toast(errText(e),true);f.elements.body.value=body}};
};
acts.reportMsg=async el=>{
  modal(html`<h3>Report this message</h3><form data-form="rep"><label class="f">Reason</label><select class="in" name="reason">${['SPAM','ABUSE','HARASSMENT','MISINFORMATION','OTHER'].map(x=>html`<option value="${x}">${nice(x)}</option>`)}</select><label class="f" style="margin-top:12px">Anything else we should know? (optional)</label><textarea name="note" rows="3" maxlength="300"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-act="closeM">Cancel</button><button class="btn primary">Send report</button></div></form>`);
  forms.rep=async f=>{try{await api(`/api/chat/messages/${el.dataset.id}/report`,{body:{reason:f.elements.reason.value,note:f.elements.note.value.trim()||null}});closeModal();toast('Thanks. An administrator will review it.')}catch(e){toast(errText(e),true)}}};
acts.closeM=closeModal;

/* ---- admin ---- */
let admFilter='';
DASH['ADMIN:institutions']=async c=>{
  const rows=await api('/api/admin/institutions'+(admFilter?'?status='+admFilter:''));
  mount(c,html`<div class="row between"><h2 style="margin:0">Institutions</h2><div class="seg">${['','PENDING','VERIFIED','REJECTED','SUSPENDED'].map(s=>html`<button class="${s===admFilter?'on':''}" data-act="admF" data-v="${s}">${s?nice(s):'All'}</button>`)}</div></div>
  <div class="card tbl" style="margin-top:16px">${rows.length?html`<table><thead><tr><th>Name</th><th>Type</th><th>Licence</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>html`<tr><td><b>${r.name}</b><div class="small muted">${r.address||''}</div></td><td>${nice(r.type)}</td><td>${r.licenceNumber}</td><td class="small">${r.email}<br>${r.publicPhone}</td>
   <td><span class="pill ${r.status==='VERIFIED'?'ok':r.status==='PENDING'?'warn':'mute'}">${nice(r.status)}</span>${r.statusReason?html`<div class="small muted">${r.statusReason}</div>`:''}</td>
   <td><div class="row" style="gap:6px">${r.status!=='VERIFIED'?html`<button class="btn teal sm" data-act="admDo" data-id="${r.id}" data-do="verify">Verify</button>`:''}${r.status==='PENDING'?html`<button class="btn danger sm" data-act="admDo" data-id="${r.id}" data-do="reject">Reject</button>`:''}${r.status==='VERIFIED'?html`<button class="btn danger sm" data-act="admDo" data-id="${r.id}" data-do="suspend">Suspend</button>`:''}</div></td></tr>`)}</tbody></table>`:html`<div class="empty">No institutions here.</div>`}</div>`)};
acts.admF=el=>{admFilter=el.dataset.v;render()};
acts.admDo=async el=>{const d=el.dataset.do;let reason=null;if(d!=='verify'){reason=await askText(nice(d)+' this institution','Reason (shown to the institution)',nice(d));if(reason===null)return}
  try{await api(`/api/admin/institutions/${el.dataset.id}/${d}`,{body:{reason:reason||null}});toast('Done.');render()}catch(e){toast(errText(e),true)}};
let repFilter='OPEN';
DASH['ADMIN:reports']=async c=>{
  const rows=await api('/api/admin/reports?status='+repFilter);
  mount(c,html`<div class="row between"><h2 style="margin:0">Reported messages</h2><div class="seg">${['OPEN','ACTIONED','DISMISSED'].map(s=>html`<button class="${s===repFilter?'on':''}" data-act="repF" data-v="${s}">${nice(s)}</button>`)}</div></div>
  <div class="grid" style="margin-top:16px">${rows.length?rows.map(r=>html`<div class="card row between"><div><b>${nice(r.reason)}</b> <span class="pill mute">${nice(r.reporterType)} reported</span><div class="small muted">${when(r.createdAt)}${r.note?' · '+r.note:''}</div></div><button class="btn ghost sm" data-act="repOpen" data-id="${r.id}">Review</button></div>`):html`<div class="card empty">Nothing to review.</div>`}</div>`)};
acts.repF=el=>{repFilter=el.dataset.v;render()};
acts.repOpen=async el=>{try{const r=await api('/api/admin/reports/'+el.dataset.id);
  modal(html`<h3>${nice(r.reason)}</h3>${r.message?html`<div class="card flat"><div class="small muted">${nice(r.message.senderType)} wrote · ${when(r.message.sentAt)}</div><p style="margin:6px 0 0">${r.message.body}</p></div>`:''}${r.note?html`<p class="small">Reporter’s note: ${r.note}</p>`:''}
  ${r.status==='OPEN'?html`<form data-form="resolve"><label class="f" style="margin-top:12px">Decision</label><select class="in" name="status"><option value="ACTIONED">Action taken</option><option value="DISMISSED">Dismiss</option></select><label class="f" style="margin-top:12px">Note</label><textarea name="note" rows="2" maxlength="300"></textarea><div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-act="closeM">Close</button><button class="btn primary">Save decision</button></div></form>`:html`<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeM">Close</button></div>`}`);
  forms.resolve=async f=>{try{await api(`/api/admin/reports/${el.dataset.id}/resolve`,{body:{status:f.elements.status.value,note:f.elements.note.value.trim()||null}});closeModal();toast('Saved.');render()}catch(e){toast(errText(e),true)}}}catch(e){toast(errText(e),true)}};
DASH['ADMIN:audit']=async c=>{const rows=await api('/api/admin/audit');
  mount(c,html`<h2>Audit log</h2><div class="card tbl">${rows.length?html`<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>${rows.map(r=>html`<tr><td>${when(r.at)}</td><td>${nice(r.actorType)}</td><td><b>${nice(r.action)}</b></td><td>${nice(r.targetType)}</td><td class="small">${r.detail||''}</td></tr>`)}</tbody></table>`:html`<div class="empty">No entries yet.</div>`}</div>`)};
DASH['ADMIN:import']=async c=>{
  mount(c,html`<h2>Import official institutions</h2><div class="card"><p class="muted">Upload a CSV of verified hospitals and blood banks. Start with a check run: nothing is saved until you turn it off.</p>
  <form data-form="imp" class="grid" style="max-width:480px"><input type="file" name="file" accept=".csv,text/csv" required><label class="row"><input type="checkbox" name="dry" checked> Check only (do not save)</label><div><button class="btn primary">Run</button></div></form><div id="impOut"></div></div>`)};
forms.imp=f=>busy($('button',f),async()=>{const fd=new FormData();fd.append('file',f.elements.file.files[0]);const dry=f.elements.dry.checked;
  try{const r=await api('/api/admin/import/institutions?dryRun='+dry,{form:fd,method:'POST',okStatuses:[422]});mount($('#impOut'),html`<h3 style="margin-top:20px">${dry?'Check result':'Import result'}</h3><pre style="white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:12px;overflow:auto;max-height:340px">${JSON.stringify(r,null,2)}</pre>`)}catch(e){toast(errText(e),true)}});
/* ============ RAKTA ASSISTANT ============ */
var astOpen=false;const astMsgs=[];
function renderAssistantFab(){
  let root=$('#ast-root');if(!root){root=document.createElement('div');root.id='ast-root';document.body.append(root)}
  mount(root,html`<button class="fab" data-act="astToggle" aria-label="Ask Rakta">${raw(ico.chat)}Ask Rakta</button>${astOpen?html`<div class="ast" role="dialog" aria-label="Rakta assistant"><header><span>Rakta assistant</span><button class="icon-btn" style="width:30px;height:30px;background:transparent;color:inherit;border-color:rgba(255,255,255,.4)" data-act="astToggle" aria-label="Close">✕</button></header>
   <div class="msgs" id="amsgs">${astMsgs.length?astMsgs.map(m=>html`<div class="msg ${m.me?'me':''}">${m.text}</div>`):html`<div class="msg">Hi, I’m Rakta. Ask me about donating blood, who can donate, or how to use Raktaveda.</div>`}</div>
   ${S.token?html`<form class="composer" data-form="ask"><input name="q" maxlength="300" placeholder="Type your question" autocomplete="off" required><button class="btn primary sm">Ask</button></form>`:html`<div class="composer"><a class="btn primary" style="flex:1" href="#/login">Log in to ask a question</a></div>`}</div>`:''}`);
  const m=$('#amsgs');if(m)m.scrollTop=m.scrollHeight;
}
acts.astToggle=()=>{astOpen=!astOpen;renderAssistantFab();const i=$('.ast input');if(i)i.focus()};
forms.ask=async f=>{const q=f.elements.q.value.trim();if(!q)return;astMsgs.push({me:true,text:q});astMsgs.push({text:'…',tmp:true});renderAssistantFab();
  let text;try{const r=await api('/api/v1/assistant/ask',{body:{question:q}});text=r.answer+(r.remainingToday!=null&&r.remainingToday<=3?`\n\n(${r.remainingToday} questions left today)`:'')}catch(e){text=errText(e)}
  astMsgs.pop();astMsgs.push({text});renderAssistantFab();const i=$('.ast input');if(i)i.focus()};

/* ============ BOOT ============ */
document.documentElement.lang=S.lang;
PAGES.home&&render();
if(S.token&&S.role){api('/api/auth/me').then(me=>setSession(S.token,me.role||S.role,me.institutionStatus||null)).catch(()=>{})}
