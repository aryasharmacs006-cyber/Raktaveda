services:
  db:
    image: postgis/postgis:16-3.4
    container_name: raktaveda-db
    environment:
      POSTGRES_DB: raktaveda
      POSTGRES_USER: raktaveda
      POSTGRES_PASSWORD: ${RAKTAVEDA_DB_PASSWORD:?Set RAKTAVEDA_DB_PASSWORD in .env}
    # Bound to this computer only, so nobody else on the network can reach the database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raktaveda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raktaveda -d raktaveda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  raktaveda_pgdata:
